name: Feature request
description: Suggest a new template or an improvement for n8n-workflow-templates.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste tokens, API keys, webhook URLs, or other credentials into this form. Redact them first.**
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / new template
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
